<!-- 기존 topbar 바로 아래에 추가 -->
<nav class="main-nav" aria-label="주요 메뉴">
  <button class="nav-button active" data-view="meals">
    🍚 급식
  </button>
  <button class="nav-button" data-view="calendar">
    📅 학사일정
  </button>
  <button class="nav-button" data-view="memos">
    📝 날짜별 메모
  </button>
</nav>

<!-- 기존 급식 콘텐츠를 이 영역 안에 유지 -->
<main class="container">
  <section id="page-meals" class="page-view active">
    <!-- 기존 hero, 오늘의 식단, 주간 급식표,
         급식 정보 안내를 그대로 이동 -->
  </section>

  <!-- 신규 학사일정 화면 -->
  <section id="page-calendar" class="page-view" hidden>
    <div class="page-heading">
      <span class="eyebrow">SCHOOL CALENDAR</span>
      <h1>학사일정</h1>
      <p>학교의 주요 일정과 행사 정보를 확인하세요.</p>
    </div>

    <div class="calendar-toolbar">
      <button id="calendarPrev" class="icon-button"
        aria-label="이전 달">←</button>
      <h2 id="calendarMonth">학사일정</h2>
      <button id="calendarNext" class="icon-button"
        aria-label="다음 달">→</button>
    </div>

    <div id="calendarGrid" class="calendar-grid"></div>

    <section class="date-detail">
      <h2 id="calendarSelectedDate">날짜를 선택하세요</h2>
      <div id="schoolEvents"></div>
      <div id="publicMemoList"></div>
    </section>
  </section>

  <!-- 신규 메모 화면 -->
  <section id="page-memos" class="page-view" hidden>
    <div class="page-heading">
      <span class="eyebrow">MY NOTES</span>
      <h1>날짜별 메모</h1>
      <p>수행평가, 시험 범위, 준비물을 기록하세요.</p>
    </div>

    <label for="memoDate">날짜 선택</label>
    <input id="memoDate" type="date">

    <section class="note-card">
      <h2>내 개인 메모</h2>
      <p class="muted">이 브라우저에만 저장됩니다.</p>
      <textarea id="personalMemo" rows="6"
        placeholder="예: 수학 수행평가 준비, 과학 보고서 제출"></textarea>
      <button id="savePersonalMemo" class="primary-button">
        개인 메모 저장
      </button>
      <p id="personalMemoStatus" aria-live="polite"></p>
    </section>

    <section class="note-card">
      <h2>학교 공통 메모</h2>
      <p class="muted">관리자가 등록한 공지와 준비 사항입니다.</p>
      <div id="sharedMemoList"></div>
    </section>

    <section class="note-card">
      <h2>관리자</h2>
      <p id="adminStatus" class="muted">로그인이 필요합니다.</p>

      <form id="adminLoginForm">
        <label for="adminEmail">관리자 이메일</label>
        <input id="adminEmail" type="email" autocomplete="username"
          required>

        <label for="adminPassword">비밀번호</label>
        <input id="adminPassword" type="password"
          autocomplete="current-password" required>

        <button class="primary-button" type="submit">
          관리자 로그인
        </button>
      </form>

      <button id="adminLogout" type="button" hidden>
        로그아웃
      </button>

      <form id="sharedMemoForm" hidden>
        <h3>공통 메모 등록</h3>
        <label for="sharedTitle">제목</label>
        <input id="sharedTitle" maxlength="100" required>

        <label for="sharedContent">내용</label>
        <textarea id="sharedContent" rows="4"
          maxlength="3000" required></textarea>

        <button class="primary-button" type="submit">
          공통 메모 등록
        </button>
      </form>
    </section>
  </section>
</main>

<!-- 기존 footer 유지 -->

<!-- 기존 급식 script.js는 그대로 유지 -->
<script src="./script.js" defer></script>
<script type="module" src="./calendar.js"></script>
