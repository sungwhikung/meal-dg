<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfaf7">
  <meta name="description" content="논산대건고등학교 급식과 학사일정">
  <title>대건밀 · 논산대건고등학교</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./calendar.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#">대건밀</a>
      <span class="school-name">논산대건고등학교</span>
    </div>
    <nav class="tabs" aria-label="주요 메뉴">
      <button class="nav-button active" data-page="meals">급식</button>
      <button class="nav-button" data-page="calendar">학사일정</button>
      <button class="nav-button" data-page="notices">공지</button>
    </nav>
  </header>

  <main class="container">
    <section id="page-meals" class="page-section active">
      <div class="day-bar">
        <button class="icon-button" id="prevDay" aria-label="이전 날">‹</button>
        <div class="day-title">
          <h1 id="selectedDate">—</h1>
          <span class="date-label" id="dateLabel"></span>
        </div>
        <button class="icon-button" id="nextDay" aria-label="다음 날">›</button>
        <button class="text-button today-button" id="todayBtn">오늘</button>
      </div>
      <div id="mealCards" class="meal-grid"><p class="placeholder">불러오는 중…</p></div>

      <div class="section-head">
        <h2>주간 식단</h2>
        <div class="week-controls">
          <button class="icon-button small" id="prevWeek" aria-label="이전 주">‹</button>
          <span id="weekLabel"></span>
          <button class="icon-button small" id="nextWeek" aria-label="다음 주">›</button>
        </div>
      </div>
      <div id="weekList" class="week-list"></div>
      <p class="source-note">나이스 교육정보 개방 포털 자료입니다. 실제 메뉴는 학교 사정에 따라 바뀔 수 있습니다.</p>
    </section>

    <section id="page-calendar" class="page-section">
      <div class="calendar-panel">
        <div class="calendar-toolbar">
          <button class="icon-button" id="calendarPrev" aria-label="이전 달">‹</button>
          <h1 id="calendarMonth">—</h1>
          <button class="icon-button" id="calendarNext" aria-label="다음 달">›</button>
          <button class="text-button today-button" id="calendarToday">이번 달</button>
        </div>
        <div class="calendar-grid calendar-weekdays"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span></div>
        <div id="calendarGrid" class="calendar-grid"></div>
        <div class="calendar-legend"><span><i class="legend-dot school"></i>학사일정</span><span><i class="legend-dot notice"></i>공지</span><span><i class="legend-dot personal"></i>내 메모</span></div>
      </div>
      <div class="calendar-lower">
        <article class="panel">
          <h3 id="selectedCalendarDate">날짜를 선택하세요</h3>
          <div id="scheduleDetails" class="schedule-list"><p class="empty-state">날짜를 선택하면 일정이 표시됩니다.</p></div>
        </article>
        <article class="panel">
          <div class="panel-heading"><h3>내 메모</h3><span class="private-label">이 기기에만 저장</span></div>
          <label class="field-label" for="personalMemoDate">날짜</label>
          <input id="personalMemoDate" type="date">
          <label class="field-label" for="personalMemoText">내용</label>
          <textarea id="personalMemoText" rows="4" placeholder="준비물, 할 일 등"></textarea>
          <div class="button-row"><button class="button button-primary" id="savePersonalMemo">저장</button><button class="button button-quiet" id="deletePersonalMemo">삭제</button></div>
          <p id="personalMemoStatus" class="status-text" aria-live="polite"></p>
        </article>
      </div>
    </section>

    <section id="page-notices" class="page-section">
      <div class="section-head first">
        <h1>공지</h1>
        <button class="text-button" id="reloadPublicMemos">새로고침</button>
      </div>
      <div id="publicMemoList" class="notice-list"><p class="placeholder">불러오는 중…</p></div>

      <details class="admin-panel">
        <summary>관리자</summary>
        <div id="authLoggedOut">
          <div class="form-grid">
            <div><label class="field-label" for="adminEmail">이메일</label><input id="adminEmail" type="email" autocomplete="username"></div>
            <div><label class="field-label" for="adminPassword">비밀번호</label><input id="adminPassword" type="password" autocomplete="current-password"></div>
          </div>
          <button class="button button-primary full-width" id="adminLogin">로그인</button>
        </div>
        <div id="authLoggedIn" hidden>
          <div class="logged-in-row"><div><strong id="loggedInEmail">—</strong><p id="adminRoleStatus" class="muted">로그인 상태</p></div><button class="button button-quiet" id="adminLogout">로그아웃</button></div>
        </div>
        <p id="authStatus" class="status-text" aria-live="polite"></p>
        <div id="adminMemoEditor" class="editor" hidden>
          <div class="editor-title-row"><h4 id="memoEditorTitle">공지 작성</h4><button id="cancelPublicMemo" class="text-button" type="button">취소</button></div>
          <input id="publicMemoId" type="hidden">
          <label class="field-label" for="publicMemoDate">날짜</label><input id="publicMemoDate" type="date">
          <label class="field-label" for="publicMemoTitle">제목</label><input id="publicMemoTitle" maxlength="100">
          <label class="field-label" for="publicMemoContent">내용</label><textarea id="publicMemoContent" rows="5" maxlength="5000"></textarea>
          <button class="button button-primary full-width" id="savePublicMemo">저장</button>
          <p id="publicMemoEditorStatus" class="status-text" aria-live="polite"></p>
        </div>
      </details>
    </section>

    <footer class="footer">
      <p>데이터 갱신 <span id="updatedAt">확인 중</span></p>
      <p>개인 프로젝트이며 학교 공식 서비스가 아닙니다.</p>
    </footer>
  </main>
</body>
</html>
