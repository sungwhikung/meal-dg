
name: Update school meal data

on:
  workflow_dispatch:

  schedule:
    # UTC 20:00 = 한국 시간 다음 날 오전 05:00
    - cron: "0 20 * * *"

permissions:
  contents: write

jobs:
  update-meals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch NEIS meal data
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: python scripts/fetch_meals.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add meals.json

          if ! git diff --cached --quiet; then
            git commit -m "Update school meal data"
            git push
          else
            echo "No changes in meal data."
          fi
